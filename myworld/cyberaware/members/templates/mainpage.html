<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberAware – Main page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #111827 0%, #020617 40%, #000000 100%);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-shell {
            width: 100%;
            max-width: 1100px;
            height: 630px;
            background: #020617;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                    0 25px 50px rgba(15, 23, 42, 0.7),
                    0 0 0 1px rgba(148, 163, 184, 0.15);
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        }

        /* Left visual panel */
        .visual-panel {
            position: relative;
            background: radial-gradient(circle at 0% 30%, #1d4ed8 0, #020617 55%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .visual-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                    radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.4), transparent 55%),
                    radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.45), transparent 55%);
            mix-blend-mode: screen;
            opacity: 0.75;
            pointer-events: none;
        }

        .hero-graphic {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 32px;
            overflow: hidden;
            box-shadow:
                    0 30px 80px rgba(15, 23, 42, 0.9),
                    0 0 0 1px rgba(148, 163, 184, 0.25);
        }

        .hero-graphic img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Right content panel */
        .content-panel {
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            padding: 32px 40px 40px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: 2px solid #312e81;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                    radial-gradient(circle at 30% 20%, #6366f1, transparent 55%),
                    radial-gradient(circle at 70% 80%, #22c1c3, transparent 55%),
                    #0f172a;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.22);
        }

        .brand-mark {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 20%, #e5e7eb, #6366f1);
        }

        .brand-name {
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: 0.03em;
            color: #111827;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-size: 0.95rem;
        }

        .nav-link {
            color: #4b5563;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: color 0.12s ease;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(to right, #4f46e5, #a855f7);
            opacity: 0;
            transform: scaleX(0.9);
            transform-origin: center;
            transition: opacity 0.12s ease, transform 0.12s ease;
        }

        .nav-link:hover {
            color: #1d4ed8;
        }

        .nav-link:hover::after {
            opacity: 1;
            transform: scaleX(1);
        }

        .main-copy {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            padding-right: 14px;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-size: 0.7rem;
            color: #9ca3af;
            font-weight: 600;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
        }

        .description {
            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.6;
            max-width: 26rem;
        }

        .cta-row {
            margin-top: 12px;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 26px;
            border-radius: 999px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f9fafb;
            cursor: pointer;
            background: radial-gradient(circle at 0 0, #f97316 0, transparent 55%),
                        linear-gradient(to right, #4f46e5, #8b5cf6, #ec4899);
            box-shadow:
                    0 14px 30px rgba(79, 70, 229, 0.45),
                    0 0 0 1px rgba(129, 140, 248, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .cta-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
            box-shadow:
                    0 20px 40px rgba(79, 70, 229, 0.6),
                    0 0 0 1px rgba(129, 140, 248, 0.5);
        }

        .cta-button:active {
            transform: translateY(0);
            box-shadow:
                    0 10px 24px rgba(79, 70, 229, 0.5),
                    0 0 0 1px rgba(129, 140, 248, 0.5);
        }

        .footer-note {
            margin-top: 26px;
            font-size: 0.75rem;
            color: #9ca3af;
        }

        /* Simple responsiveness */
        @media (max-width: 900px) {
            body {
                padding: 24px;
                align-items: flex-start;
            }

            .page-shell {
                height: auto;
                min-height: 520px;
                grid-template-columns: 1fr;
            }

            .visual-panel {
                order: -1;
                padding: 24px;
            }

            .content-panel {
                padding: 24px 24px 28px;
            }

            .top-bar {
                margin-bottom: 28px;
            }
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
            }

            .page-shell {
                border-radius: 16px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .nav-links {
                gap: 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="page-shell">
    <section class="visual-panel" aria-hidden="true">
        <div class="hero-graphic">
            <img src="/static/images/cyberaware_main.png" alt="CyberAware visual representation">
        </div>
    </section>

    <section class="content-panel">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-logo">
                    <div class="brand-mark"></div>
                </div>
                <div class="brand-name">CyberAware</div>
            </div>
            <nav class="nav-links" aria-label="Primary navigation">
                <a href="/courses/" class="nav-link primary">Courses</a>
                <a href="/login/" class="nav-link">Log in</a>
            </nav>
        </header>

        <main class="main-copy">
            <div class="eyebrow">Main page</div>
            <h1>What is CyberAware?</h1>
            <p class="description">
                CyberAware is a web-based platform aimed at educating users in cybersecurity through
                interactive and gamified learning experiences.
            </p>
            <div class="cta-row">
                <button class="cta-button" type="button">
                    More info
                </button>
            </div>

            <p class="footer-note">
                Explore curated courses, track your progress, and stay ahead of emerging digital threats.
            </p>
        </main>
    </section>
</div>
</body>
</html>
