<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberAware – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #0f172a 0%, #020617 40%, #0369a1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-shell {
            width: 100%;
            max-width: 1024px;
            height: 560px;
            background: #020617;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                    0 24px 60px rgba(15, 23, 42, 0.85),
                    0 0 0 1px rgba(148, 163, 184, 0.2);
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        }

        /* Left visual */
        .visual-panel {
            position: relative;
            background: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                    radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.75), transparent 55%),
                    radial-gradient(circle at 90% 100%, rgba(59, 130, 246, 0.6), transparent 60%);
            mix-blend-mode: screen;
            opacity: 0.8;
        }

        .hero-graphic {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 0;
            overflow: hidden;
        }

        .hero-graphic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Right login panel */
        .login-panel {
            background: #e0f2fe;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background:
                    radial-gradient(circle at 20% 20%, #38bdf8, transparent 60%),
                    radial-gradient(circle at 80% 80%, #0ea5e9, transparent 60%),
                    #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark-inner {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid rgba(191, 219, 254, 0.85);
        }

        .brand-text {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #0f172a;
        }

        .login-card {
            margin-top: 12px;
            max-width: 320px;
        }

        .login-card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 18px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 22px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .pill-input {
            width: 100%;
            border-radius: 999px;
            border: none;
            padding: 10px 20px;
            background: #e5e7eb;
            color: #111827;
            font-size: 0.95rem;
            outline: none;
            box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.5);
        }

        .pill-input::placeholder {
            color: #9ca3af;
        }

        .login-button {
            margin-top: 10px;
            width: 100%;
            border-radius: 999px;
            border: none;
            padding: 10px 24px;
            background: linear-gradient(to right, #4f46e5, #8b5cf6, #ec4899);
            color: #f9fafb;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                    0 14px 30px rgba(79, 70, 229, 0.45),
                    0 0 0 1px rgba(129, 140, 248, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow:
                    0 18px 40px rgba(79, 70, 229, 0.6),
                    0 0 0 1px rgba(129, 140, 248, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .helper-row {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #475569;
        }

        .helper-row a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .back-row {
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #0f172a;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link span {
            font-size: 1.1rem;
        }

        .error-message {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #b91c1c;
        }

        @media (max-width: 900px) {
            .page-shell {
                max-width: 640px;
                height: auto;
                grid-template-columns: 1fr;
            }

            .visual-panel {
                height: 220px;
            }
        }
    </style>
</head>
<body>
<div class="page-shell">
    <section class="visual-panel" aria-hidden="true">
        <div class="hero-graphic">
            <img src="/static/images/cyberaware_main.png" alt="CyberAware illustration">
        </div>
    </section>

    <section class="login-panel">
        <div class="brand-row">
            <div class="brand-mark">
                <div class="brand-mark-inner"></div>
            </div>
            <div class="brand-text">CyberAware</div>
        </div>

        <div class="login-card">
            <h2>Secure access</h2>
            <h1>Log in to your account</h1>

            <form method="post">
                {% csrf_token %}
                <div class="field-group">
                    <input class="pill-input" type="text" name="username" placeholder="login" required>
                </div>
                <div class="field-group">
                    <input class="pill-input" type="password" name="password" placeholder="password" required>
                </div>

                <button class="login-button" type="submit">Continue</button>

                <div class="helper-row">
                    First time here? Just choose a login and password –
                    we will create your account automatically.
                </div>

                <div class="back-row">
                    <a class="back-link" href="/">
                        <span>←</span>
                        <span>Back to main page</span>
                    </a>
                </div>

                {% if message %}
                    <p class="error-message">{{ message }}</p>
                {% endif %}
            </form>
        </div>
    </section>
</div>
</body>
</html>
