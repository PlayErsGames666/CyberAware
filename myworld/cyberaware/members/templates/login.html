<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberAware – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-surface: #0b1220;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --accent-strong: #eab308;
            --card: #020617;
            --card-soft: rgba(15, 23, 42, 0.85);
            --border-subtle: rgba(148, 163, 184, 0.35);
            --text-main: #e5e7eb;
            --text-soft: #9ca3af;
            --text-strong: #f9fafb;
            --sidebar: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                    radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.45), transparent 55%),
                    radial-gradient(circle at 88% 92%, rgba(59, 130, 246, 0.45), transparent 55%),
                    linear-gradient(180deg, #020617 0%, #020617 45%, #020617 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .shell {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
            width: 100%;
            max-width: 1024px;
            min-height: 560px;
            background: rgba(15, 23, 42, 0.92);
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                    0 32px 80px rgba(15, 23, 42, 0.9),
                    0 0 0 1px rgba(148, 163, 184, 0.35);
        }

        /* Left visual panel */
        .visual-panel {
            position: relative;
            background:
                    radial-gradient(circle at 0 0, rgba(96, 165, 250, 0.4), transparent 55%),
                    radial-gradient(circle at 100% 100%, rgba(34, 197, 94, 0.25), transparent 55%),
                    var(--sidebar);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .visual-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                    radial-gradient(circle at 10% 0%, rgba(56, 189, 248, 0.75), transparent 55%),
                    radial-gradient(circle at 90% 100%, rgba(59, 130, 246, 0.6), transparent 60%);
            mix-blend-mode: screen;
            opacity: 0.8;
            pointer-events: none;
        }

        .hero-graphic {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            z-index: 1;
        }

        .hero-graphic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Right login panel */
        .login-panel {
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            background:
                    radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.38), transparent 55%),
                    radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.45), transparent 60%),
                    var(--bg-surface);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background:
                    radial-gradient(circle at 20% 20%, #38bdf8, transparent 60%),
                    radial-gradient(circle at 80% 80%, #0ea5e9, transparent 60%),
                    #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid rgba(56, 189, 248, 0.85);
        }

        .brand-text {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-strong);
        }

        .login-card {
            margin-top: 12px;
            max-width: 320px;
        }

        .login-card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-soft);
            margin-bottom: 18px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-strong);
            margin-bottom: 22px;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .pill-input {
            width: 100%;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .pill-input::placeholder {
            color: var(--text-soft);
        }

        .pill-input:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.9);
        }

        .login-button {
            margin-top: 10px;
            width: 100%;
            border-radius: 999px;
            border: none;
            padding: 10px 24px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #020617;
            font-weight: 600;
            cursor: pointer;
            box-shadow:
                    0 14px 30px rgba(56, 189, 248, 0.45),
                    0 0 0 1px rgba(56, 189, 248, 0.35);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
            box-shadow:
                    0 18px 40px rgba(56, 189, 248, 0.6),
                    0 0 0 1px rgba(56, 189, 248, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .helper-row {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-soft);
            line-height: 1.5;
        }

        .back-row {
            margin-top: 10px;
            font-size: 0.85rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #bae6fd;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .back-link:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .back-link span {
            font-size: 1.1rem;
        }

        .error-message {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #f87171;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        @media (max-width: 900px) {
            .shell {
                max-width: 640px;
                min-height: auto;
                grid-template-columns: 1fr;
            }

            .visual-panel {
                height: 220px;
                order: -1;
            }

            .login-panel {
                padding: 24px 28px 28px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 8px;
            }

            .login-panel {
                padding: 20px 20px 24px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="visual-panel" aria-hidden="true">
        <div class="hero-graphic">
            <img src="/static/images/cyberaware_main.png" alt="CyberAware illustration">
        </div>
    </section>

    <section class="login-panel">
        <div class="brand-row">
            <div class="brand-logo">
                <div class="brand-mark"></div>
            </div>
            <div class="brand-text">CyberAware</div>
        </div>

        <div class="login-card">
            <h2>Secure access</h2>
            <h1>Log in to your account</h1>

            <form method="post">
                {% csrf_token %}
                <div class="field-group">
                    <input class="pill-input" type="text" name="username" placeholder="login" required>
                </div>
                <div class="field-group">
                    <input class="pill-input" type="password" name="password" placeholder="password" required>
                </div>

                <button class="login-button" type="submit">Continue</button>

                <div class="helper-row">
                    First time here? Just choose a login and password –
                    we will create your account automatically.
                </div>

                <div class="back-row">
                    <a class="back-link" href="/">
                        <span>←</span>
                        <span>Back to main page</span>
                    </a>
                </div>

                {% if message %}
                    <p class="error-message">{{ message }}</p>
                {% endif %}
            </form>
        </div>
    </section>
</div>
</body>
</html>
