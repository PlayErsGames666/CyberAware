<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberAware – Courses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-surface: #0b1220;
            --accent: #38bdf8;
            --accent-soft: rgba(56, 189, 248, 0.15);
            --accent-strong: #eab308;
            --card: #020617;
            --card-soft: rgba(15, 23, 42, 0.85);
            --border-subtle: rgba(148, 163, 184, 0.35);
            --text-main: #e5e7eb;
            --text-soft: #9ca3af;
            --text-strong: #f9fafb;
            --sidebar: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                    radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.45), transparent 55%),
                    radial-gradient(circle at 88% 92%, rgba(59, 130, 246, 0.45), transparent 55%),
                    linear-gradient(180deg, #020617 0%, #020617 45%, #020617 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .shell {
            display: grid;
            grid-template-columns: 260px minmax(0, 580px);
            width: 100%;
            max-width: 980px;
            min-height: 540px;
            background: rgba(15, 23, 42, 0.92);
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                    0 32px 80px rgba(15, 23, 42, 0.9),
                    0 0 0 1px rgba(148, 163, 184, 0.35);
        }

        /* Sidebar */
        .sidebar {
            background:
                    radial-gradient(circle at 0 0, rgba(96, 165, 250, 0.4), transparent 55%),
                    radial-gradient(circle at 100% 100%, rgba(34, 197, 94, 0.25), transparent 55%),
                    var(--sidebar);
            border-right: 1px solid rgba(15, 23, 42, 0.9);
            padding: 24px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background:
                    radial-gradient(circle at 20% 20%, #38bdf8, transparent 60%),
                    radial-gradient(circle at 80% 80%, #0ea5e9, transparent 60%),
                    #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-mark {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            border: 2px solid rgba(56, 189, 248, 0.85);
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-strong);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .nav-section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: rgba(148, 163, 184, 0.9);
            margin-bottom: 2px;
        }

        .nav-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: rgba(15, 23, 42, 0.75);
            color: var(--text-main);
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
        }

        .nav-button span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-button svg {
            width: 16px;
            height: 16px;
        }

        .nav-button--primary {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #020617;
            font-weight: 600;
        }

        .nav-button:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.7);
            transform: translateY(-1px);
        }

        .nav-button--primary:hover {
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            border-color: transparent;
        }

        .back-button {
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid rgba(15, 23, 42, 0.9);
        }

        /* Main content */
        .content {
            padding: 24px 26px 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background:
                    radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.38), transparent 55%),
                    radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.45), transparent 60%),
                    var(--bg-surface);
            overflow-y: auto;
        }

        .headline-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .headline-row h1 {
            font-size: 1.55rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            font-style: italic;
            color: var(--text-strong);
        }

        .headline-caption {
            font-size: 0.85rem;
            color: var(--text-soft);
        }

        .courses-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .course-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.85));
            border-radius: 14px;
            padding: 14px 16px 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.9);
            transition: transform 0.12s ease, border-color 0.12s ease;
        }

        .course-card:hover {
            transform: translateY(-2px);
            border-color: rgba(56, 189, 248, 0.6);
        }

        .course-row {
            display: grid;
            grid-template-columns: 26px 1fr;
            align-items: center;
            gap: 12px;
        }

        .radio {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid var(--border-subtle);
            display: grid;
            place-items: center;
            background: rgba(15, 23, 42, 0.9);
        }

        .radio-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--accent);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.12s ease, transform 0.12s ease;
        }

        .course-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .course-input:checked + .course-label .radio-dot {
            opacity: 1;
            transform: scale(1);
        }

        .course-label {
            display: contents;
            cursor: pointer;
        }

        .course-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--text-strong);
            font-style: italic;
            cursor: pointer;
        }

        .course-title:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .course-card.no-radio .radio {
            display: none;
        }

        .course-card.no-radio .course-row {
            grid-template-columns: 1fr;
        }

        .info-card {
            margin-top: 6px;
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(24, 35, 58, 0.95));
            border: 1px solid var(--border-subtle);
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            line-height: 1.5;
            min-height: 52px;
            display: flex;
            align-items: center;
        }

        .footer-row {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-soft);
        }

        .footer-row a {
            color: #bae6fd;
            text-decoration: none;
        }

        .footer-row a:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .shell {
                grid-template-columns: 1fr;
                max-width: 560px;
                min-height: 0;
            }

            .sidebar {
                border-right: none;
                border-bottom: 1px solid rgba(15, 23, 42, 0.9);
                flex-direction: row;
                align-items: center;
                gap: 18px;
            }

            .brand-header {
                flex-direction: row;
                align-items: center;
            }

            .nav {
                flex: 1;
                margin-top: 0;
                flex-direction: row;
                flex-wrap: wrap;
            }

            .back-button {
                display: none;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 8px;
            }

            .content {
                padding: 18px 16px 16px;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand-header">
            <div class="brand-logo">
                <div class="brand-mark"></div>
            </div>
            <div class="brand-name">CyberAware</div>
        </div>

        <nav class="nav" aria-label="Navigation">
            <div class="nav-section-label">Navigation</div>

            <a href="{% url 'profile' %}" class="nav-button">
                <span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 19c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.4"
                              stroke-linecap="round"/>
                        <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4"/>
                    </svg>
                    <span>Profile</span>
                </span>
            </a>

            <a href="{% url 'courses' %}" class="nav-button nav-button--primary">
                <span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 7.5 12 4l8 3.5-8 3.5L4 7.5Z" stroke="currentColor" stroke-width="1.4"
                              stroke-linejoin="round"/>
                        <path d="M4 12l8 3.5 8-3.5" stroke="currentColor" stroke-width="1.4"
                              stroke-linejoin="round"/>
                    </svg>
                    <span>Courses</span>
                </span>
            </a>

            <a href="/" class="nav-button">
                <span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.4"/>
                        <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="1.4"/>
                    </svg>
                    <span>Home</span>
                </span>
            </a>
        </nav>

        <div class="back-button">
            <a href="/" class="nav-button">
                <span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="1.4"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Back</span>
                </span>
            </a>
        </div>
    </aside>

    <main class="content">
        <div class="headline-row">
            <h1>Courses</h1>
            <span class="headline-caption">Select a course to begin</span>
        </div>

        <section class="courses-list" aria-label="Courses list">
            {% for c in courses %}
                <div class="course-card no-radio" data-description="{{ c.description|escape }}">
                    <div class="course-row">
                        <input class="course-input" type="radio" name="course" id="course-{{ c.id }}" value="{{ c.id }}" {% if forloop.first %}checked{% endif %}>
                        <label class="course-label" for="course-{{ c.id }}">
                            <span class="radio" aria-hidden="true"><span class="radio-dot"></span></span>
                            <span class="course-title" tabindex="0">{{ c.title }}</span>
                        </label>
                    </div>
                </div>
            {% endfor %}
        </section>

        <div class="info-card" id="courseInfo" aria-live="polite">Hover a course name to see details.</div>

        <div class="footer-row">
            <span>CyberAware Learning Platform</span>
            <a href="/">← Back to main</a>
        </div>
    </main>
</div>

<script>
    (function () {
        const cards = Array.from(document.querySelectorAll(".course-card"));
        const info = document.getElementById("courseInfo");

        function setInfo(text) {
            info.textContent = text || "Hover a course name to see details.";
        }

        function getCardDescription(card) {
            return card?.dataset?.description || "";
        }

        // Initial text = selected course
        const initiallyChecked = document.querySelector(".course-input:checked");
        const initialCard = initiallyChecked?.closest(".course-card");
        setInfo(getCardDescription(initialCard));

        cards.forEach((card) => {
            const input = card.querySelector(".course-input");
            const title = card.querySelector(".course-title");

            card.addEventListener("mouseenter", () => setInfo(getCardDescription(card)));
            card.addEventListener("focusin", () => setInfo(getCardDescription(card)));
            card.addEventListener("mouseleave", () => {
                const checked = document.querySelector(".course-input:checked");
                setInfo(getCardDescription(checked?.closest(".course-card")));
            });
            card.addEventListener("focusout", () => {
                const checked = document.querySelector(".course-input:checked");
                setInfo(getCardDescription(checked?.closest(".course-card")));
            });

            input?.addEventListener("change", () => setInfo(getCardDescription(card)));

            // Click on course title opens lectures page directly
            title?.addEventListener("click", (event) => {
                event.preventDefault();
                const id = input?.value;
                if (!id) return;
                window.location.href = `/courses/${id}/`;
            });
        });
    })();
</script>
</body>
</html>
